<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="./assets/tiny-strange-logo.png">
  <title>Tiny Strange｜纸盒折叠演示</title>
  <style>
    @font-face{font-family:"Sofia Sans";src:url('../../assets/fonts/SofiaSans-Light.ttf') format('truetype');font-style:normal;font-weight:300;font-display:swap}
    :root{--brown:#493732;--lime:#b7d84b;--paper:#f6f0e7;--unit:min(calc(100vw / 1920),calc(100svh / 1080));--offset-x:calc((100vw - 1920 * var(--unit)) / 2);--offset-y:calc((100svh - 1080 * var(--unit)) / 2)}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--brown);font-family:"Sofia Sans",sans-serif}
    button,input{font:inherit}
    :root{--viewer-gap:max(24px,4svh);--viewer-width:calc(100vw - 2 * var(--viewer-gap));--viewer-top:var(--viewer-gap)}
    #viewer-frame{position:fixed;top:var(--viewer-top);left:50%;transform:translateX(-50%);width:var(--viewer-width);height:calc(100svh - 2 * var(--viewer-gap));border:1px solid rgba(73,55,50,.22);pointer-events:none}
    #model{position:fixed;top:calc(var(--viewer-top) + 1px);left:50%;transform:translateX(-50%);width:calc(var(--viewer-width) - 2px);background:#fff;overflow:hidden}
    #model canvas{display:block;touch-action:pan-y}
    #status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;letter-spacing:.04em;background:var(--paper);padding:12px 16px;border-radius:8px}
    #status[hidden]{display:none}
    #controls{position:fixed;z-index:2;inset:0;pointer-events:none}
    .control-row{display:contents}
    button{position:fixed;margin:0;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer;pointer-events:auto}
    button img{display:block;width:100%;height:100%;pointer-events:none}
    button:hover:not(:disabled){opacity:.68}
    button:disabled{cursor:default;opacity:.4}
    button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
    #play{left:calc(var(--offset-x) + 458.80289906791 * var(--unit));top:calc(var(--offset-y) + 838.3531332318769 * var(--unit));width:calc(51.832038119102435 * var(--unit));height:calc(57.311591114596126 * var(--unit))}
    #play.is-playing img{display:none}
    #play.is-playing::before,#play.is-playing::after{content:"";position:absolute;top:27%;width:15%;height:46%;background:var(--brown)}
    #play.is-playing::before{left:32%}
    #play.is-playing::after{right:32%}
    #fold{--progress:100%;position:fixed;left:calc(var(--offset-x) + 554.15873015868 * var(--unit));top:calc(var(--offset-y) + 856.603174603544 * var(--unit));width:calc(864.00000000003 * var(--unit));height:calc(20.126984126230127 * var(--unit));margin:0;padding:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;pointer-events:auto}
    #fold::-webkit-slider-runnable-track{height:calc(14.476190476190936 * var(--unit));background:linear-gradient(to right,var(--lime) 0 var(--progress),rgba(73,55,50,.9) var(--progress) 100%)}
    #fold::-webkit-slider-thumb{width:calc(20.126984126230127 * var(--unit));height:calc(20.126984126230127 * var(--unit));margin-top:calc(-2.825396825419595 * var(--unit));border:0;border-radius:0;background:var(--lime);appearance:none;-webkit-appearance:none}
    #fold::-moz-range-track{height:calc(14.476190476190936 * var(--unit));background:linear-gradient(to right,var(--lime) 0 var(--progress),rgba(73,55,50,.9) var(--progress) 100%)}
    #fold::-moz-range-thumb{width:calc(20.126984126230127 * var(--unit));height:calc(20.126984126230127 * var(--unit));border:0;border-radius:0;background:var(--lime)}
    #value{position:fixed;left:calc(var(--offset-x) + 1457.3809523809 * var(--unit));top:calc(var(--offset-y) + 847.199404979652 * var(--unit));width:calc(129.52380952380918 * var(--unit));height:calc(54.09523809523705 * var(--unit));color:#000;font-size:calc(40 * var(--unit));font-weight:300;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
    #expand{left:calc(var(--offset-x) + 1183.0274922964 * var(--unit));top:calc(var(--offset-y) + 931.990280878004 * var(--unit));width:calc(105.97233005232556 * var(--unit));height:calc(28.2802734375 * var(--unit))}
    #collapse{left:calc(var(--offset-x) + 1331.30114628493 * var(--unit));top:calc(var(--offset-y) + 932.469773065504 * var(--unit));width:calc(63.29264255232556 * var(--unit));height:calc(27.80078125 * var(--unit))}
    #reset{left:calc(var(--offset-x) + 1443.74162936211 * var(--unit));top:calc(var(--offset-y) + 933.589890253004 * var(--unit));width:calc(92.279296875 * var(--unit));height:calc(26.6806640625 * var(--unit))}
    /* Compact controls share one right edge; keep the original text-button gaps. */
    #controls{inset:auto;left:calc(var(--offset-x) + 572 * var(--unit));top:calc(var(--offset-y) + 838.3531332318769 * var(--unit));width:calc(900 * var(--unit))}
    .control-row:first-child{display:grid;grid-template-columns:calc(44 * var(--unit)) minmax(0,1fr) calc(104 * var(--unit));align-items:center;gap:calc(32 * var(--unit))}
    .control-row:nth-child(2){display:flex;align-items:center;justify-content:flex-end;margin-top:calc(28 * var(--unit))}
    #play,#expand,#collapse,#reset{position:relative;left:auto;top:auto;display:flex;align-items:center;justify-content:center}
    #play{width:calc(44 * var(--unit));height:calc(44 * var(--unit))}
    #play img{width:calc(22 * var(--unit));height:calc(24 * var(--unit))}
    #play.is-playing::before,#play.is-playing::after{top:50%;width:calc(5 * var(--unit));height:calc(24 * var(--unit));transform:translateY(-50%)}
    #play.is-playing::before{left:calc(50% - 9 * var(--unit))}#play.is-playing::after{right:calc(50% - 9 * var(--unit))}
    #fold{position:static;width:100%;height:calc(44 * var(--unit))}
    #fold::-webkit-slider-runnable-track{height:calc(8 * var(--unit))}
    #fold::-moz-range-track{height:calc(8 * var(--unit))}
    #fold::-webkit-slider-thumb{width:calc(14 * var(--unit));height:calc(14 * var(--unit));margin-top:calc(-3 * var(--unit))}
    #fold::-moz-range-thumb{width:calc(14 * var(--unit));height:calc(14 * var(--unit))}
    #value{position:static;width:100%;height:calc(44 * var(--unit));font-size:calc(32 * var(--unit));display:flex;align-items:center;justify-content:flex-end;text-align:right}
    #expand{width:calc(84.77786404186045 * var(--unit));height:calc(36 * var(--unit))}
    #collapse{width:calc(50.63411404186045 * var(--unit));height:calc(36 * var(--unit));margin-left:calc(42.30132393620444 * var(--unit))}
    #reset{width:calc(73.8234375 * var(--unit));height:calc(36 * var(--unit));margin-left:calc(49.14784052485444 * var(--unit));justify-content:flex-end}
    #expand img,#collapse img,#reset img{height:auto}
    @media(max-width:640px),(max-height:480px){
      :root{--viewer-gap:12px}
      #controls{inset:auto 20px max(16px,env(safe-area-inset-bottom));width:auto;pointer-events:none}
      .control-row:first-child{display:grid;grid-template-columns:44px minmax(0,1fr) 56px;align-items:center;gap:12px}
      .control-row:nth-child(2){display:flex;justify-content:flex-end;gap:20px;margin-top:4px}
      #play,#expand,#collapse,#reset{position:static;width:auto;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center}
      #play img{width:20px;height:22px}#expand img,#collapse img,#reset img{width:auto;height:16px}
      #collapse,#reset{margin-left:0}
      #play.is-playing::before,#play.is-playing::after{width:4px;height:22px}
      #play.is-playing::before{left:calc(50% - 8px)}#play.is-playing::after{right:calc(50% - 8px)}
      #play{position:relative;left:auto;top:auto}
      #fold{position:static;width:100%;height:44px}
      #fold::-webkit-slider-runnable-track{height:4px}#fold::-webkit-slider-thumb{width:12px;height:12px;margin-top:-4px}
      #fold::-moz-range-track{height:4px}#fold::-moz-range-thumb{width:12px;height:12px}
      #value{position:static;width:56px;height:44px;font-size:18px;display:flex;align-items:center;justify-content:flex-end}
    }
  </style>
  <script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
  <div id="viewer-frame" aria-hidden="true"></div>
  <main id="model" aria-label="Tiny Strange 三维纸盒模型，可拖动旋转，滚轮缩放，单指上下滑动浏览页面"></main>
  <div id="status" role="status">正在载入真实纸盒模型…</div>
  <div id="controls" aria-label="折叠控制">
    <div class="control-row"><button id="play" type="button" aria-label="Play" aria-pressed="false" disabled><img src="../../assets/fold-play.svg" alt="" draggable="false"></button><input id="fold" type="range" min="0" max="100" step="0.1" value="100" aria-label="折叠进度" disabled><span id="value">100%</span></div>
    <div class="control-row"><button id="expand" type="button" aria-label="Unfold" disabled><img src="../../assets/fold-unfold.svg" alt="" draggable="false"></button><button id="collapse" type="button" aria-label="Fold" disabled><img src="../../assets/fold-fold.svg" alt="" draggable="false"></button><button id="reset" type="button" aria-label="Reset" disabled><img src="../../assets/fold-reset.svg" alt="" draggable="false"></button></div>
  </div>
  <script type="module" src="./fold-quality.js?v=2026-11-18-equal-inset-5-chapter-recovery-1"></script>
</body>
</html>
