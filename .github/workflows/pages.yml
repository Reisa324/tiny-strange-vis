name: Unpublish GitHub Pages
on:
  push:
    branches: [main]
permissions:
  actions: write
  pages: write
jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the GitHub Pages site and disable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "DELETE /repos/${GITHUB_REPOSITORY}/pages"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/pages" --include
          echo "PUT /repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/disable"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/disable" --include
          exit 0
